name: Prompt Factory Validation

on:
  pull_request:
    paths:
      - 'SKILL.md'
      - 'README.md'
      - 'manifest.yaml'
      - 'references/**'
      - 'scripts/**'
      - 'evals/**'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Static contracts and regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Validate skill structure and references
        run: python scripts/validate_prompt_factory.py
      - name: Run unit regressions
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
