name: Validate Prompt Factory

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Run static skill validator
        run: python scripts/validate_prompt_factory.py .

      - name: Run validator regression tests
        run: python scripts/test_validate_prompt_factory.py
