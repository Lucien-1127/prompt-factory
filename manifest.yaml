manifest_schema: "1.0"
repository:
  id: prompt-factory
  name: 提示詞工廠
  version: "11.1.0"
  type: skill
  language: zh-TW
  description: 按需討論、生成、優化及評估提示詞；代理、工具、視覺媒體與多代理契約分開載入。
entrypoints:
  ai:
    file: SKILL.md
    optional: false
  human:
    file: README.md
    optional: false
  interface:
    file: agents/openai.yaml
    optional: true
resources:
  - references/templates.md
  - references/session-kernel.md
  - references/agent-runtime-contract.md
  - references/tool-contract.md
  - references/orchestration.md
  - references/evaluation-security.md
validation:
  script: scripts/validate_prompt_factory.py
  regression_tests: scripts/test_validate_prompt_factory.py
  behavior_fixtures: evals/behavior-cases.json
  evidence_level: static
runtime:
  status: disabled
  description: 本套件提供提示詞與執行契約，不含自主執行器；工具能力依目標環境實際提供。
